name: repere
# Premier lancement, ou après « Le démarrage du conteneur a changé » dans les journaux :
#   docker compose up -d --build
# Ensuite : docker compose up -d. Pour mettre à jour, redémarrer le conteneur « app » (Docker Desktop ou
# « docker compose restart app ») : au démarrage, il récupère la dernière version validée par les tests sur GitHub.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      # Connexion par le socket Unix partagé avec « db » (authentification locale de l'image PostgreSQL) :
      # aucun mot de passe à conserver ni à synchroniser.
      DATABASE_URL: "postgresql+psycopg://repere@/repere?host=/run/postgresql"
      REPERE_DATA_DIR: /app/data
      # Source des mises à jour : branche « valide », avancée par GitHub Actions quand les tests réussissent.
      REPERE_GITHUB_REPO: "${REPERE_GITHUB_REPO:-Dicalius/Repere}"
      REPERE_GITHUB_REF: "${REPERE_GITHUB_REF:-valide}"
      # Facultatif : nécessaire seulement si le dépôt devient privé (jeton en lecture seule sur ce dépôt).
      REPERE_GITHUB_TOKEN: "${REPERE_GITHUB_TOKEN:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      PARSER_RULES_PATH: /app/config/parsers.json
      # Identifiant du jeu « DPE Logements existants » de l'ADEME (il a déjà changé plusieurs fois)
      ADEME_DPE_DATASET: "${ADEME_DPE_DATASET:-meg-83tjwtg8dyz4vv7h1dqe}"
      # Recherche d'adresse lancée après chaque capture (lieu, DPE et surface envoyés à l'ADEME). 0 pour désactiver.
      ADEME_AUTO_SEARCH: "${ADEME_AUTO_SEARCH:-1}"
    volumes:
      - app_data:/app/data
      - pg_socket:/run/postgresql:ro
      - ./config/parsers.json:/app/config/parsers.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Marge pour le téléchargement d'une version et, rarement, l'installation de nouvelles dépendances.
      start_period: 600s
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repere
      POSTGRES_USER: repere
      # Sert uniquement à la création de la base (connexions réseau). Vide : un mot de passe aléatoire est
      # généré ; l'application, elle, passe par le socket. Une base existante n'est pas modifiée.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        [ -n "$$POSTGRES_PASSWORD" ] || { POSTGRES_PASSWORD="$$(tr -dc a-f0-9 </dev/urandom | head -c 48)"; export POSTGRES_PASSWORD; };
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pg_socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U repere -d repere"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  postgres_data:
  app_data:
  pg_socket:
