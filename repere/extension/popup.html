<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Repère</title><link rel="stylesheet" href="popup.css"></head><body>
<header><span class="logo">r.</span><div><h1>repère</h1><p>Une annonce qui mérite le détour.</p></div></header>
<details id="settings"><summary>Connexion au comparateur</summary><label>Code de connexion<input id="token" type="password" autocomplete="off" placeholder="Le même code que dans Repère"></label><button id="save" class="secondary">Enregistrer</button></details>
<button id="read">1. Lire l’annonce ouverte</button>
<section id="preview" hidden><p id="source" class="small"></p><label>Texte capturé<textarea id="text" rows="7"></textarea></label><p id="count" class="small"></p><label class="check"><input id="onlyText" type="checkbox">Utiliser seulement ce texte</label><details><summary id="extraLabel">HTML et métadonnées inclus</summary><pre id="extras"></pre></details><button id="check" class="secondary">Vérifier les champs localement</button><div id="facts" hidden></div><label class="check"><input id="gemini" type="checkbox">Compléter avec Gemini</label><p class="small">Cette option transmet le contenu de l’annonce à Gemini. Les calculs de financement restent locaux.</p><button id="send">2. Ajouter à Repère</button><button id="export" class="secondary">Exporter la capture</button></section>
<p id="status" role="status"></p><button id="open" class="secondary">Ouvrir le comparateur ↗</button>
<script src="popup.js"></script></body></html>
