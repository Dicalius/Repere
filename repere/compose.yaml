name: repere
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      DATABASE_URL: "postgresql+psycopg://repere:${POSTGRES_PASSWORD:?Lance INITIALISER.ps1 ou demarrer.sh pour creer .env}@db:5432/repere"
      REPERE_DATA_DIR: /app/data
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      PARSER_RULES_PATH: /app/config/parsers.json
      # Identifiant du jeu « DPE Logements existants » de l'ADEME (il a déjà changé plusieurs fois)
      ADEME_DPE_DATASET: "${ADEME_DPE_DATASET:-meg-83tjwtg8dyz4vv7h1dqe}"
      # Recherche d'adresse lancée après chaque capture (lieu, DPE et surface envoyés à l'ADEME). 0 pour désactiver.
      ADEME_AUTO_SEARCH: "${ADEME_AUTO_SEARCH:-1}"
    volumes:
      - app_data:/app/data
      - ./config/parsers.json:/app/config/parsers.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repere
      POSTGRES_USER: repere
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Mot de passe manquant}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U repere -d repere"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  postgres_data:
  app_data:
