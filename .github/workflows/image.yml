# Tests à chaque push et pull request ; image Docker publiée sur ghcr.io après fusion dans main.
name: Image Repère

on:
  push:
    branches: [main]
    paths-ignore: ["extension/**", "**.md", "LISEZ_MOI.txt", "*.bat", "*.ps1", "*.sh"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances Python
        run: python -m pip install -r tests/requirements.txt
      - name: Tests Python (base SQLite temporaire, sans réseau)
        run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests de l'extension (jsdom)
        run: |
          npm install --prefix tests --no-audit --no-fund
          npm test --prefix tests

  image:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version de l'application
        id: version
        run: echo "value=$(python3 -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('app/__init__.py').read())[1])")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Les noms d'images ghcr.io sont en minuscules.
          images: ghcr.io/${{ github.repository_owner }}/repere
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
