# Tests à chaque push et pull request. Quand ils réussissent sur main, la branche « valide » est avancée sur ce
# commit : c'est elle que le conteneur « app » télécharge à chaque démarrage (docker/entrypoint.py).
name: Validation Repère

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances Python
        run: python -m pip install -r tests/requirements.txt
      - name: Tests Python (base SQLite temporaire, faux GitHub local)
        run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests de l'extension (jsdom)
        run: |
          npm install --prefix tests --no-audit --no-fund
          npm test --prefix tests

  valider:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Avancer la branche « valide » sur ce commit
        run: git push --force origin "HEAD:refs/heads/valide"
      - name: Résumé
        run: |
          echo "Version validée : ${GITHUB_SHA::7}. Redémarre le conteneur app pour l'installer." >> "$GITHUB_STEP_SUMMARY"
