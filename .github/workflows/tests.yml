# Tests à chaque push et pull request. Ils tournent en parallèle de la construction de l'image et ne la
# bloquent pas : un échec s'affiche en rouge dans l'onglet Actions.
name: Tests Repère

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances Python
        run: python -m pip install -r tests/requirements.txt
      - name: Tests Python (base SQLite temporaire, sans réseau)
        run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests de l'extension (jsdom)
        run: |
          npm install --prefix tests --no-audit --no-fund
          npm test --prefix tests
